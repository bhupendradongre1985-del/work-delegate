<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f6feb">
<title>GS TEAM</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--ink:#1b2333;--mut:#6b7686;--pri:#1f6feb;--ok:#1a9d5b;--warn:#e08a00;--bad:#d64545;--line:#e3e8f0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top)}
.hide{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 4px}
p.sub{color:var(--mut);margin:0 0 16px;font-size:14px}
input,select,textarea,button{font:inherit}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:10px}
textarea{min-height:70px;resize:vertical}
button{border:0;border-radius:10px;padding:12px 16px;font-weight:600;cursor:pointer}
.btn{background:var(--pri);color:#fff;width:100%}
.btn.alt{background:#e8eefc;color:var(--pri)}
.link{background:none;color:var(--pri);width:100%;padding:8px}
.box{background:var(--card);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(20,30,60,.06)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin-bottom:6px}
header{background:var(--pri);color:#fff;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:5}
header b{font-size:17px}
header small{display:block;opacity:.85;font-size:12px}
header button{background:rgba(255,255,255,.18);color:#fff;padding:8px 12px;font-size:13px}
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:56px;z-index:4}
.tabs button{flex:1;background:none;border-radius:0;padding:13px 2px;color:var(--mut);font-size:13px;border-bottom:3px solid transparent}
.tabs button.on{color:var(--pri);border-bottom-color:var(--pri)}
.task{background:#fff;border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,30,60,.06);border-left:5px solid var(--line)}
.task.p-high{border-left-color:var(--bad)}.task.p-med{border-left-color:var(--warn)}.task.p-low{border-left-color:var(--ok)}
.task.done{opacity:.65}
.task h3{margin:0 0 4px;font-size:16px}
.task .d{color:var(--mut);font-size:13px;margin:0 0 8px;white-space:pre-wrap}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;margin-bottom:10px}
.chip{background:#eef2f8;border-radius:20px;padding:4px 10px;color:#3b4660}
.chip.late{background:#fde8e8;color:var(--bad)}
.note{background:#fffbe6;border-radius:8px;padding:8px;font-size:13px;margin-bottom:10px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{padding:8px 10px;font-size:13px;background:#eef2f8;color:#3b4660}
.acts button.cur{background:var(--pri);color:#fff}
.acts button.del{background:#fde8e8;color:var(--bad);margin-left:auto}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:auto;border-radius:30px;padding:15px 22px;box-shadow:0 4px 14px rgba(31,111,235,.45);z-index:6}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:20}
.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px;max-width:560px;margin:0 auto}
label{font-size:13px;color:var(--mut);display:block;margin:2px 0 4px}
.row{display:flex;gap:10px}.row>div{flex:1}
.code{font-size:26px;letter-spacing:4px;font-weight:800;color:var(--pri);text-align:center}
.stat{display:flex;gap:8px;margin-bottom:12px}
.stat div{flex:1;background:#fff;border-radius:12px;padding:10px;text-align:center;font-size:12px;color:var(--mut)}
.stat b{display:block;font-size:20px;color:var(--ink)}
.spin{text-align:center;padding:60px;color:var(--mut)}
</style>
</head>
<body>

<div id="loading" class="spin">Loading...</div>

<!-- LOGIN -->
<div id="auth" class="wrap hide">
  <h1>📋 GS TEAM</h1>
  <p class="sub">Assign work to your team and track status, live.</p>
  <div class="box">
    <input id="a-name" placeholder="Your name" class="hide">
    <input id="a-phone" type="tel" placeholder="WhatsApp number (e.g. 9876543210)" class="hide">
    <input id="a-email" type="email" placeholder="Email" autocomplete="email">
    <input id="a-pass" type="password" placeholder="Password (at least 6 characters)" autocomplete="current-password">
    <div id="a-err" class="err"></div>
    <button id="a-go" class="btn">Login</button>
    <button id="a-toggle" class="link">Create a new account</button>
  </div>
</div>

<!-- TEAM -->
<div id="team" class="wrap hide">
  <h1>Choose your team</h1>
  <p class="sub">Create a new team or enter your team code.</p>
  <div class="box">
    <b>Create a new team</b><br><br>
    <input id="t-name" placeholder="Team name (e.g. GS Team)">
    <button id="t-create" class="btn">Create Team</button>
  </div>
  <div class="box">
    <b>Join with a code</b><br><br>
    <input id="t-code" placeholder="6-character team code" maxlength="6" style="text-transform:uppercase">
    <label>Your role</label>
    <select id="t-role"><option value="exec">Executive</option><option value="manager">SEO Manager</option></select>
    <button id="t-join" class="btn alt">Join</button>
  </div>
  <div id="t-err" class="err"></div>
  <button id="t-logout" class="link">Logout</button>
</div>

<!-- MAIN -->
<div id="main" class="hide">
  <header>
    <div><b id="m-team">Team</b><small id="m-user"></small></div>
    <div><button id="m-info">Team Code</button> <button id="m-logout">Logout</button></div>
  </header>
  <div class="tabs">
    <button data-t="mine" class="on">My Tasks</button>
    <button data-t="given">Assigned</button>
    <button data-t="all">Team</button>
    <button data-t="report">📋 Report</button>
  </div>
  <div class="wrap">
    <div class="stat" id="stat"></div>
    <div id="list"></div>
  </div>
  <button id="fab" class="btn fab">+ New Task</button>
</div>

<!-- NEW TASK -->
<div id="modal" class="modal hide">
  <div class="sheet">
    <h1 style="margin-top:0">Assign a New Task</h1>
    <label>What is the task?</label>
    <input id="n-title" placeholder="e.g. Prepare the monthly report">
    <label>Details (optional)</label>
    <textarea id="n-desc"></textarea>
    <label>Assign to</label>
    <input id="n-to" list="n-to-list" placeholder="Type a name or pick from team" autocomplete="off"><datalist id="n-to-list"></datalist>
    <label>WhatsApp number (only if not in the team)</label>
    <input id="n-phone" type="tel" placeholder="9876543210">
    <div class="row">
      <div><label>Last date</label><input id="n-due" type="date"></div>
      <div><label>Priority</label>
        <select id="n-pri"><option value="high">🔴 Urgent</option><option value="med" selected>🟠 Normal</option><option value="low">🟢 Low</option></select></div>
    </div>
    <div id="n-err" class="err"></div>
    <button id="n-save" class="btn">Send Task</button>
    <button id="n-cancel" class="link">Cancel</button>
  </div>
</div>

<!-- TEAM INFO -->
<div id="info" class="modal hide">
  <div class="sheet">
    <h1 style="margin-top:0">Team Code</h1>
    <p class="sub">Share this code with your staff. They enter it under "Join with a code".</p>
    <div class="code" id="i-code"></div>
    <label style="margin-top:12px">My WhatsApp number</label>
    <input id="i-phone" type="tel" placeholder="9876543210">
    <button id="i-phone-save" class="btn alt">Save my number</button>
    <p class="sub" style="margin-top:14px">Members:</p>
    <div id="i-members"></div>
    <button id="i-close" class="btn alt" style="margin-top:12px">Close</button>
  </div>
</div>

<script src="firebase-config.js"></script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,updateProfile} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,updateDoc,deleteDoc,addDoc,collection,query,where,onSnapshot,arrayUnion,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const show=id=>{["loading","auth","team","main"].forEach(x=>$(x).classList.toggle("hide",x!==id))};

if(!window.FIREBASE_CONFIG||FIREBASE_CONFIG.apiKey==="YAHAN_APIKEY"){
  $("loading").innerHTML="⚠️ Firebase config missing.<br>Paste your config into www/firebase-config.js.";
  throw new Error("no config");
}
const app=initializeApp(FIREBASE_CONFIG);
const auth=getAuth(app), db=getFirestore(app);

let me=null, teamId=null, team=null, tab="mine", tasks=[], unsubTasks=null, unsubTeam=null, signup=false;

const errMsg=e=>{const c=e.code||"";
  if(c.includes("invalid-credential")||c.includes("wrong-password")||c.includes("user-not-found"))return"Incorrect email or password.";
  if(c.includes("email-already"))return"This email is already registered.";
  if(c.includes("weak-password"))return"Password must be at least 6 characters.";
  if(c.includes("invalid-email"))return"Invalid email address.";
  if(c.includes("network"))return"Check your internet connection.";
  if(c.includes("permission"))return"Permission denied (check Firestore rules).";
  return e.message||"Something went wrong.";};

// ---------- AUTH ----------
$("a-toggle").onclick=()=>{signup=!signup;
  $("a-name").classList.toggle("hide",!signup);
  $("a-phone").classList.toggle("hide",!signup);
  $("a-go").textContent=signup?"Create Account":"Login";
  $("a-toggle").textContent=signup?"Already have an account? Log in":"Create a new account";
  $("a-err").textContent="";};
$("a-go").onclick=async()=>{
  const email=$("a-email").value.trim(), pass=$("a-pass").value, name=$("a-name").value.trim();
  $("a-err").textContent="";
  try{
    if(signup){
      if(!name){$("a-err").textContent="Enter your name.";return;}
      const phone=waNum($("a-phone").value); if(!phone){$("a-err").textContent="Enter a valid WhatsApp number.";return;}
      const c=await createUserWithEmailAndPassword(auth,email,pass);
      await updateProfile(c.user,{displayName:name});
      await setDoc(doc(db,"users",c.user.uid),{name,email,teamId:null,phone});
    }else await signInWithEmailAndPassword(auth,email,pass);
  }catch(e){$("a-err").textContent=errMsg(e);}
};
$("m-logout").onclick=$("t-logout").onclick=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
  cleanup();
  if(!u){me=null;show("auth");return;}
  me={uid:u.uid,name:u.displayName||u.email};
  try{
    // the user doc may still be created during signup
    let s=await getDoc(doc(db,"users",u.uid));
    if(!s.exists()){await setDoc(doc(db,"users",u.uid),{name:me.name,email:u.email,teamId:null});s=await getDoc(doc(db,"users",u.uid));}
    teamId=s.data().teamId||null; me.phone=s.data().phone||"";
    teamId?openTeam():show("team");
  }catch(e){show("team");$("t-err").textContent=errMsg(e);}
});

function cleanup(){unsubTasks&&unsubTasks();unsubTeam&&unsubTeam();unsubTasks=unsubTeam=null;tasks=[];team=null;}

// ---------- TEAM ----------
const genCode=()=>{const a="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";let s="";for(let i=0;i<6;i++)s+=a[Math.floor(Math.random()*a.length)];return s;};
$("t-create").onclick=async()=>{
  const name=$("t-name").value.trim(); $("t-err").textContent="";
  if(!name){$("t-err").textContent="Enter a team name.";return;}
  try{
    const code=genCode();
    await setDoc(doc(db,"teams",code),{name,owner:me.uid,memberUids:[me.uid],members:[{uid:me.uid,name:me.name,role:"boss",phone:me.phone||""}],createdAt:serverTimestamp()});
    await updateDoc(doc(db,"users",me.uid),{teamId:code});
    teamId=code;openTeam();
  }catch(e){$("t-err").textContent=errMsg(e);}
};
$("t-join").onclick=async()=>{
  const code=$("t-code").value.trim().toUpperCase(); $("t-err").textContent="";
  if(code.length!==6){$("t-err").textContent="Enter the 6-character code.";return;}
  try{
    const r=doc(db,"teams",code), s=await getDoc(r);
    if(!s.exists()){$("t-err").textContent="Invalid team code.";return;}
    const d=s.data();
    if(!d.memberUids.includes(me.uid))
      await updateDoc(r,{memberUids:arrayUnion(me.uid),members:arrayUnion({uid:me.uid,name:me.name,role:$("t-role").value,phone:me.phone||""})});
    await updateDoc(doc(db,"users",me.uid),{teamId:code});
    teamId=code;openTeam();
  }catch(e){$("t-err").textContent=errMsg(e);}
};

function openTeam(){
  show("main");
  $("m-user").textContent=me.name;
  unsubTeam=onSnapshot(doc(db,"teams",teamId),s=>{
    if(!s.exists())return; team=s.data();
    $("m-team").textContent=team.name; fillMembers(); renderInfo(); render();
  });
  unsubTasks=onSnapshot(query(collection(db,"tasks"),where("teamId","==",teamId)),s=>{
    const all=s.docs.map(d=>({id:d.id,...d.data()}));
    reports=all.filter(t=>t.type==="report").sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    tasks=all.filter(t=>t.type!=="report");
    tasks.sort((a,b)=>(a.status==="done")-(b.status==="done")||(a.due||"9999").localeCompare(b.due||"9999"));
    render();
  },e=>{$("list").innerHTML=`<div class="empty">${esc(errMsg(e))}</div>`;});
}

function fillMembers(){
  const r=roleOf(me.uid);
  const list=team.members.filter(m=>r==="boss"||m.uid===me.uid||roleOf(m.uid)==="exec");
  $("n-to-list").innerHTML=list.map(m=>`<option value="${esc(m.name)}">${esc(RL[roleOf(m.uid)])}${m.uid===me.uid?" - you":""}</option>`).join("");
}
function renderInfo(){
  $("i-code").textContent=teamId;
  const boss=roleOf(me.uid)==="boss";
  const hint=boss?'<p class="sub">Set each person\'s role. "Sees all" lets them view everyone\'s tasks and reports.</p>':'';
  $("i-members").innerHTML=hint+team.members.map(m=>{const r=roleOf(m.uid);
    const ctl=boss?'<select data-role="'+esc(m.uid)+'" style="width:auto;margin:0;padding:6px">'+["boss","manager","exec"].map(k=>'<option value="'+k+'"'+(r===k?" selected":"")+'>'+RL[k]+'</option>').join("")+'</select>'+
      (r!=="boss"?'<label style="margin:0;display:flex;gap:6px;align-items:center;white-space:nowrap"><input type="checkbox" style="width:auto;margin:0" data-seeall="'+esc(m.uid)+'"'+(m.seeAll!==false?" checked":"")+'> Sees all</label>':''):'<small style="color:var(--mut)">'+RL[r]+'</small>';
    return '<div style="display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line)"><b>'+esc(m.name)+(m.uid===me.uid?" (you)":"")+'</b><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">'+ctl+'</div></div>';}).join("");
}
$("m-info").onclick=()=>{$("i-phone").value=((team&&team.members.find(m=>m.uid===me.uid))||{}).phone||me.phone||"";$("info").classList.remove("hide");};
$("i-phone-save").onclick=async()=>{const ph=waNum($("i-phone").value);if(!ph){alert("Enter a valid WhatsApp number.");return;}
  try{await updateDoc(doc(db,"users",me.uid),{phone:ph});me.phone=ph;
    await updateDoc(doc(db,"teams",teamId),{members:team.members.map(m=>m.uid===me.uid?{...m,phone:ph}:m)});alert("Number saved ✅");}
  catch(e){alert(errMsg(e));}};
$("i-close").onclick=()=>$("info").classList.add("hide");
$("i-members").onchange=async e=>{const t=e.target, ds=t.dataset||{};
  let members=null;
  if(ds.seeall){members=team.members.map(m=>m.uid===ds.seeall?{...m,seeAll:t.checked}:m);}
  else if(ds.role){
    members=team.members.map(m=>m.uid===ds.role?{...m,role:t.value}:m);
    if(!members.some(m=>(m.role||(m.uid===team.owner?"boss":"exec"))==="boss")){alert("The team needs at least one Boss.");renderInfo();return;}
    if(t.value==="boss"&&!confirm("Give this person full Boss access?")){renderInfo();return;}
  }else return;
  try{await updateDoc(doc(db,"teams",teamId),{members});}catch(err){alert(errMsg(err));}};

// ---------- TASKS ----------
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;document.querySelectorAll(".tabs button").forEach(x=>x.classList.toggle("on",x===b));render();});

const SL={todo:"To Do",doing:"In Progress",done:"Done"};
const RL={boss:"Boss",manager:"SEO Manager",exec:"Executive"};
const roleOf=uid=>{if(!team)return"exec";const m=team.members.find(x=>x.uid===uid);if(m&&m.role)return m.role;return uid===team.owner?"boss":"exec";};
const canSeeAll=()=>{if(!team)return false;if(roleOf(me.uid)==="boss")return true;const m=team.members.find(x=>x.uid===me.uid);return !m||m.seeAll!==false;};
let reports=[];
const waNum=raw=>{let d=String(raw||"").replace(/\D/g,"").replace(/^0+/,"");if(d.length===10)d="91"+d;return d.length>=11?d:"";};
const PRL={high:"Urgent",med:"Normal",low:"Low"};
const taskMsg=(t,rem)=>(rem?"⏰ Reminder: pending task":"📋 New task from GS TEAM")+"\n\nTask: "+t.title+(t.desc?"\nDetails: "+t.desc:"")+"\nAssigned by: "+t.assignedByName+(t.due?"\nDeadline: "+t.due:"")+"\nPriority: "+(PRL[t.priority]||"Normal")+"\n\nPlease update the status in the GS TEAM app.";
const openWa=(ph,text)=>window.open("https://wa.me/"+ph+"?text="+encodeURIComponent(text),"_blank");
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};

const RST={notstarted:"Not Started",inprogress:"In Progress",pending:"Pending",completed:"Completed"};
let editRid=null, skipKeep=false;
const dayStats=(uid,date)=>{const a=reports.filter(r=>r.assignedBy===uid&&r.date===date);
  return{n:a.length,c:a.filter(r=>r.status==="completed").length,p:a.filter(r=>r.status==="inprogress").length,
    pe:a.filter(r=>r.status==="pending"||r.status==="notstarted").length};};
const reportText=r=>{const s=dayStats(r.assignedBy,r.date);
  return "📋 DAILY FOLLOW-UP REPORT\n\nDate: "+r.date+"\n\nTASK DETAILS\nTask: "+r.task+"\nAssigned By: "+r.byRole+"\nFollow-up Staff: "+r.staff+
  "\n\nFOLLOW-UP STATUS\n"+Object.keys(RST).map(k=>(r.status===k?"☑ ":"☐ ")+RST[k]).join("\n")+
  "\n\nUPDATE\nLatest Update: "+(r.update||"-")+"\nRemarks: "+(r.remarks||"-")+"\nNext Follow-up: "+(r.next||"-")+
  "\n\nDAILY SUMMARY\nAssigned: "+s.n+"  Completed: "+s.c+"  In Progress: "+s.p+"  Pending: "+s.pe+"\n\nSubmitted By: "+r.assignedByName;};

function renderReport(){
  $("stat").innerHTML="";
  const td=today(), ed=editRid?reports.find(x=>x.id===editRid):null;
  const cur=(!skipKeep&&$("r-task"))?{task:$("r-task").value,byRole:$("r-by").value,staff:$("r-staff").value,status:$("r-status").value,
    update:$("r-update").value,remarks:$("r-remarks").value,next:$("r-next").value}:null;
  skipKeep=false;
  const d=cur||ed||{};
  const opt=(val,lab,sel)=>'<option value="'+val+'"'+(sel===val?" selected":"")+'>'+lab+'</option>';
  const seeAll=canSeeAll();
  const st=dayStats(me.uid,td);
  const visible=seeAll?reports:reports.filter(r=>r.assignedBy===me.uid);
  let h='<div class="box"><b>📋 Daily Follow-Up Report</b><p class="sub" style="margin:4px 0 10px">Date: '+td+(ed?' · <b>Edit mode</b>':'')+'</p>'+
    '<label>Task</label><input id="r-task" value="'+esc(d.task||"")+'" placeholder="Task name">'+
    '<label>Assigned By</label><select id="r-by">'+["CEO","Manager","Executive"].map(x=>opt(x,x,d.byRole||"Manager")).join("")+'</select>'+
    '<label>Follow-up Staff</label><input id="r-staff" value="'+esc(d.staff||"")+'" placeholder="Staff name">'+
    '<label>Follow-up Status</label><select id="r-status">'+Object.keys(RST).map(k=>opt(k,RST[k],d.status||"notstarted")).join("")+'</select>'+
    '<label>Latest Update</label><textarea id="r-update">'+esc(d.update||"")+'</textarea>'+
    '<label>Remarks</label><input id="r-remarks" value="'+esc(d.remarks||"")+'">'+
    '<label>Next Follow-up</label><input id="r-next" type="date" value="'+esc(d.next||"")+'">'+
    '<button id="r-save" class="btn">'+(ed?"Update":"Save Report")+'</button>'+
    (ed?'<button id="r-cancel" class="link">Edit cancel</button>':'')+'</div>';
  h+='<div class="box"><b>📊 Daily Summary for Today (yours)</b><p class="sub" style="margin:6px 0 0">Assigned: <b>'+st.n+'</b> · Completed: <b>'+st.c+'</b> · In Progress: <b>'+st.p+'</b> · Pending: <b>'+st.pe+'</b></p></div>';
  h+='<p class="sub">'+(seeAll?"All team reports":"Your reports")+'</p>';
  if(!visible.length)h+='<div class="empty">No reports yet.</div>';
  h+=visible.map(r=>'<div class="task p-'+(r.status==="completed"?"low":r.status==="pending"?"high":"med")+'"><h3>'+esc(r.task)+'</h3>'+
    '<div class="meta"><span class="chip">👤 '+esc(r.assignedByName)+'</span><span class="chip">📅 '+esc(r.date)+'</span><span class="chip">'+esc(RST[r.status]||"")+'</span>'+
    '<span class="chip">Follow-up: '+esc(r.staff)+'</span><span class="chip">By: '+esc(r.byRole)+'</span>'+(r.next?'<span class="chip">Next: '+esc(r.next)+'</span>':'')+'</div>'+
    (r.update?'<p class="d">'+esc(r.update)+'</p>':'')+(r.remarks?'<div class="note">📝 '+esc(r.remarks)+'</div>':'')+
    '<div class="acts"><button data-a="rshare" data-id="'+r.id+'">📤 Share</button>'+
    (r.assignedBy===me.uid?'<button data-a="redit" data-id="'+r.id+'">✏️ Edit</button><button class="del" data-a="rdel" data-id="'+r.id+'">🗑</button>':'')+'</div></div>').join("");
  $("list").innerHTML=h;
}

function render(){
  $("fab").classList.toggle("hide",tab==="report"||roleOf(me.uid)==="exec");
  if(tab==="report"){renderReport();return;}
  const mine=tasks.filter(t=>t.assignedTo===me.uid), given=tasks.filter(t=>t.assignedBy===me.uid);
  const set=tab==="mine"?mine:tab==="given"?given:(canSeeAll()?tasks:tasks.filter(t=>t.assignedTo===me.uid||t.assignedBy===me.uid));
  const cnt=k=>set.filter(t=>t.status===k).length;
  let sum="";
  if(tab==="all"&&team&&canSeeAll()){sum='<div class="box"><b>👥 Team Progress</b>'+team.members.map(m=>{
    const t=tasks.filter(x=>x.assignedTo===m.uid), d=t.filter(x=>x.status==="done").length,
      late=t.filter(x=>x.due&&x.due<today()&&x.status!=="done").length;
    return '<div style="display:flex;justify-content:space-between;gap:8px;padding-top:8px;margin-top:8px;border-top:1px solid var(--line)"><span>'+esc(m.name)+' <small style="color:var(--mut)">'+RL[roleOf(m.uid)]+'</small></span><span>'+d+'/'+t.length+' done'+(late?' · <b style="color:var(--bad)">'+late+' late</b>':'')+'</span></div>';}).join("")+'</div>';}
  $("stat").innerHTML=["todo","doing","done"].map(k=>`<div><b>${cnt(k)}</b>${SL[k]}</div>`).join("");
  if(!set.length){$("list").innerHTML=sum+`<div class="empty">${tab==="mine"?"No tasks assigned to you yet 🎉":tab==="given"?"You have not assigned any tasks yet.":"No tasks in the team yet."}</div>`;return;}
  $("list").innerHTML=sum+set.map(t=>{
    const late=t.due&&t.due<today()&&t.status!=="done";
    const canMove=t.assignedTo===me.uid||t.assignedBy===me.uid;
    return `<div class="task p-${esc(t.priority)} ${t.status==="done"?"done":""}">
      <h3>${esc(t.title)}</h3>
      ${t.desc?`<p class="d">${esc(t.desc)}</p>`:""}
      <div class="meta">
        <span class="chip">👤 ${esc(t.assignedToName)}</span>
        <span class="chip">📤 ${esc(t.assignedByName)}</span>
        ${t.due?`<span class="chip ${late?"late":""}">📅 ${esc(t.due)}${late?" (late)":""}</span>`:""}
      </div>
      ${t.note?`<div class="note">📝 ${esc(t.note)}</div>`:""}
      <div class="acts">
        ${canMove?["todo","doing","done"].map(k=>`<button class="${t.status===k?"cur":""}" data-a="st" data-id="${t.id}" data-v="${k}">${SL[k]}</button>`).join(""):""}
        ${canMove?`<button data-a="note" data-id="${t.id}">📝 Note</button>`:""}
        ${t.assignedBy===me.uid&&t.assignedToPhone?`<button data-a="wa" data-id="${t.id}">💬 WhatsApp</button>`:""}
        ${t.assignedBy===me.uid?`<button class="del" data-a="del" data-id="${t.id}">🗑</button>`:""}
      </div></div>`;}).join("");
}
$("list").onclick=async e=>{
  const b=e.target.closest("button");if(!b)return;
  try{
    if(b.id==="r-cancel"){editRid=null;skipKeep=true;renderReport();return;}
    if(b.dataset.a==="redit"){editRid=b.dataset.id;skipKeep=true;renderReport();window.scrollTo(0,0);return;}
    if(b.id==="r-save"){
      const data={task:$("r-task").value.trim(),byRole:$("r-by").value,staff:$("r-staff").value.trim(),status:$("r-status").value,
        update:$("r-update").value.trim(),remarks:$("r-remarks").value.trim(),next:$("r-next").value};
      if(!data.task||!data.staff){alert("Enter the task and the follow-up staff name.");return;}
      if(editRid)await updateDoc(doc(db,"tasks",editRid),data);
      else await addDoc(collection(db,"tasks"),{...data,type:"report",teamId,date:today(),assignedBy:me.uid,assignedByName:me.name,createdAt:serverTimestamp()});
      editRid=null;skipKeep=true;renderReport();alert("Report saved ✅");return;
    }
    if(b.dataset.a==="rshare"){
      const r=reports.find(x=>x.id===b.dataset.id), t=reportText(r);
      if(navigator.share){await navigator.share({text:t});}
      else if(navigator.clipboard){await navigator.clipboard.writeText(t);alert("Report copied. Paste it into WhatsApp.");}
      else prompt("Copy this:",t);
      return;
    }
    if(b.dataset.a==="rdel"){if(confirm("Delete this report?"))await deleteDoc(doc(db,"tasks",b.dataset.id));return;}
  }catch(err){if(err.name!=="AbortError")alert(errMsg(err));return;}
  const id=b.dataset.id, r=doc(db,"tasks",id), t=tasks.find(x=>x.id===id);
  try{
    if(b.dataset.a==="wa"&&t&&t.assignedToPhone)openWa(t.assignedToPhone,taskMsg(t,true));
    if(b.dataset.a==="st")await updateDoc(r,{status:b.dataset.v});
    if(b.dataset.a==="note"){const n=prompt("Write an update / note:",t.note||"");if(n!==null)await updateDoc(r,{note:n.trim()});}
    if(b.dataset.a==="del"&&confirm("Delete this task?"))await deleteDoc(r);
  }catch(err){alert(errMsg(err));}
};

$("fab").onclick=()=>{$("n-title").value="";$("n-desc").value="";$("n-to").value="";$("n-phone").value="";$("n-due").value="";$("n-err").textContent="";$("modal").classList.remove("hide");};
$("n-cancel").onclick=()=>$("modal").classList.add("hide");
$("n-save").onclick=async()=>{
  const title=$("n-title").value.trim(); if(!title){$("n-err").textContent="Enter the task name.";return;}
  const nm=$("n-to").value.trim(); if(!nm){$("n-err").textContent="Enter who the task is for.";return;}
  const to=team.members.find(m=>m.name.toLowerCase()===nm.toLowerCase());
  const toUid=to?to.uid:"", toName=to?to.name:nm;
  try{
    const ph=(to&&to.phone)?to.phone:waNum($("n-phone").value);
    const task={teamId,title,desc:$("n-desc").value.trim(),assignedTo:toUid,assignedToName:toName,assignedToPhone:ph,
      assignedBy:me.uid,assignedByName:me.name,due:$("n-due").value||"",priority:$("n-pri").value,status:"todo",note:"",createdAt:serverTimestamp()};
    await addDoc(collection(db,"tasks"),task);
    $("modal").classList.add("hide");
    if(ph&&confirm("Task saved. Send a WhatsApp message to "+toName+" now?"))openWa(ph,taskMsg(task));
  }catch(e){$("n-err").textContent=errMsg(e);}
};
</script>
